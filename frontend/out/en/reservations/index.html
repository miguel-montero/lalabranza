roduce, the fire and the wines of Viña La Quirinca.\",\"foodTitle\":\"Chilean flavors, prepared in front of you\",\"foodBody\":\"This is more than a lunch stop. The dishes are prepared and presented in front of you, fresh from the fire, while the story behind the ingredients and recipes is shared at the table. Take your time, enjoy the wine, a house pisco sour or a local beer, and share the experience with the people you came with — or the ones you meet along the way.\",\"wineTitle\":\"Wine made where you are sitting\",\"wineBody\":\"La Labranza is part of Viña La Quirinca. The wines served with the experience are made here on the estate, creating a direct connection between the vineyard outside and what is poured into your glass.\",\"atmosphereEyebrow\":\"The Estate\",\"visitTitle\":\"Hours \u0026 Location\",\"visitCta\":\"Full location details\",\"closingTitle\":\"A taste of Chile, rooted in Maipo.\",\"closingBody\":\"Come for the food and wine. Leave with a closer connection to the land, the valley and the stories behind what you tasted.\"},\"reservations\":{\"title\":\"Reserve a seating\",\"intro\":\"Seatings are limited so every table gets the full tableside experience. Choose a date, time, and party size to check availability.\",\"dateLabel\":\"Date\",\"timeLabel\":\"Seating time\",\"partySizeLabel\":\"Party size\",\"nameLabel\":\"Full name\",\"emailLabel\":\"Email\",\"phoneLabel\":\"Phone\",\"notesLabel\":\"Notes (optional)\",\"submit\":\"Request reservation\",\"submitting\":\"Requesting…\",\"successTitle\":\"Request received\",\"successBody\":\"We'll be in touch shortly to confirm your seating.\",\"errorSummaryTitle\":\"There is a problem\",\"noCapacity\":\"That seating is fully booked — try another time.\",\"genericError\":\"Something went wrong — please try again or contact us directly.\"},\"contact\":{\"eyebrow\":\"Get in Touch\"},\"footer\":{\"partOf\":\"Part of Viña La Quirinca\",\"rights\":\"All rights reserved.\"}},\"locale\":\"en\",\"pathname\":\"/en
