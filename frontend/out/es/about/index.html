a. Cada plato se prepara y presenta en su mesa, acompañado de vinos elaborados aquí, en Viña La Quirinca.\",\"originTitle\":\"Un nombre que nace de la tierra\",\"originBody\":\"La Labranza habla de trabajar y cultivar la tierra. Y difícilmente podría existir un nombre más apropiado para una experiencia en el Valle del Maipo: el propio nombre Maipo proviene del mapudungun maipun, asociado a la tierra trabajada o labrada. Aquí, el paisaje también forma parte de la comida. Los viñedos crecen a tu alrededor, los ingredientes chilenos se transforman en preparaciones recién salidas del fuego y los vinos que llegan a la mesa se elaboran en la misma viña que estás visitando. La Labranza reúne todo en una misma historia: la tierra, el viñedo, la cocina chilena y las personas que se sientan a compartirla.\",\"landTitle\":\"De la tierra a tu mesa\",\"landBody\":\"Lo que pruebas aquí está conectado con el lugar que te rodea: el viñedo, los productos de la zona, el fuego y los vinos de Viña La Quirinca.\",\"foodTitle\":\"Sabores chilenos, preparados frente a ti\",\"foodBody\":\"Esto es más que una parada para almorzar. Los platos se preparan y presentan frente a ti, recién salidos del fuego, mientras en la mesa se comparte la historia de sus ingredientes y preparaciones. La idea es disfrutar sin apuro: acompañar la comida con vino, un pisco sour de la casa o una cerveza local, y compartir el momento con quienes viniste — o con quienes conozcas durante la experiencia.\",\"wineTitle\":\"Vinos hechos en el mismo lugar que estás visitando\",\"wineBody\":\"La Labranza es parte de Viña La Quirinca. Los vinos que acompañan la experiencia se elaboran aquí, en la misma viña, conectando directamente el paisaje que ves con lo que llega a tu copa.\",\"atmosphereEyebrow\":\"El Fundo\",\"visitTitle\":\"Horario y Ubicación\",\"visitCta\":\"Ver todos los detalles\",\"closingTitle\":\"Un sabor de Chile, con raíces en el Maipo.\",\"closingBody\":\"Ven por la comida y el vino. Llévate una conexión más cercana con la tierra, el valle y las historias detrás de lo que probaste.\"},\"reservations\":{\"title\":\"Reserva una mesa\",\"intro\":\"Los cupos son limitados para que cada mesa reciba la experiencia completa. Elige fecha, hora y número de personas para consultar disponibilidad.\",\"dateLabel\":\"Fecha\",\"timeLabel\":\"Horario\",\"partySizeLabel\":\"Número de personas\",\"nameLabel\":\"Nombre completo\",\"emailLabel\":\"Correo electrónico\",\"phoneLabel\":\"Teléfono\",\"notesLabel\":\"Notas (opcional)\",\"submit\":\"Solicitar reserva\",\"submitting\":\"Enviando…\",\"successTitle\":\"Solicitud recibida\",\"successBody\":\"Nos pondremos en contacto en breve para confirmar tu reserva.\",\"errorSummaryTitle\":\"Hay un problema\",\"noCapacity\":\"Ese horario está completo — prueba con otro.\",\"genericError\":\"Algo salió mal — inténtalo de nuevo o contáctanos directamente.\"},\"contact\":{\"eyebrow\":\"Contáctanos\"},\"footer\":{\"partOf\":\"Parte de Viña La Quirinca\",\"rights\":\"Todos los derechos reservados.\"}},\"locale\":\"es\",\"pathname\":\"/es\"}],\"$L13\",\"$L14\"]}]}]\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]\n14:[\"$\",\"footer\",null,{\"className\":\"px-6 py-8 md:px-12 text-sm font-body\",\"children\":[[\"$\",\"p\",null,{\"className\":\"font-label uppercase tracking-wide\",\"children\":\"Parte de Viña La Quirinca\"}],[\"$\",\"p\",null,{\"children\":[\"© \",2026,\" La Labranza. \",\"Todos los derechos reservados.\"]}]]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}
